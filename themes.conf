# Themes for repixel
# ------------------------------------------------------------------
# One theme per line:   name = color, color, color, ...
# Colors are hex (with or without '#'), listed DARKEST -> LIGHTEST.
#
# A 4-shade grayscale source, for example, looks like this:
#   darkest ->                                        -> lightest
#   #000000     #555555     #AAAAAA     #FFFFFF
#
# The count does NOT have to match the source's shade count. repixel fits
# the palette (see --fit): an equal count is used verbatim, a larger palette
# has each shade snap to its nearest entry, and a smaller one keeps all its
# colors and mixes the missing steps in Oklab. So a 4-color theme works on a
# 2-shade logo and on a 6-shade sprite alike.
# Run `repixel <file> --list-colors` to see a source's shades.
#
# Add a new theme by copying a line and changing the name + colors.
# ------------------------------------------------------------------

mono       = 000000, 555555, AAAAAA, FFFFFF
grayscale  = 000000, FFFFFF
dithernaut = 171F41, 2F7077, FB6C76, FEEDE3
dithernaut-alt = 171F41, 2F7077, FEC09A, FEEDE3
toffee = 0d181e, 447897, d3a281, ebf7ff
chocolate-mint = 1E1310, 9A6053, 71BCCC, FEF2EE
